# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - streetsweeper

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build (client)
        working-directory: client
        run: |
          npm install
          npm run build --if-present
      
      - name: Prepare deployment package
        shell: powershell
        run: |
          mkdir -p deploy
          Copy-Item client/package*.json deploy/ -ErrorAction SilentlyContinue
          Copy-Item client/server.js deploy/ -ErrorAction SilentlyContinue
          Copy-Item client/dist deploy/dist -Recurse -ErrorAction SilentlyContinue
          cd deploy
          npm install --production
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C97DD4F20229442CA12F3A3E0FCF16EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FFF8A517DC1F4ADABE0475557A612C3C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_91ADFF63651E4593BFF667D7E9DAEB9C }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'streetsweeper'
          slot-name: 'Production'
          package: .
          