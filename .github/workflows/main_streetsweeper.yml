# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - streetsweeper

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build (client)
        working-directory: client
        env:
          EXPO_PUBLIC_STRAVA_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_STRAVA_CLIENT_ID }}
          EXPO_PUBLIC_STRAVA_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_STRAVA_CLIENT_SECRET }}
          EXPO_PUBLIC_DEFAULT_MAP_CENTER_LATITUDE: ${{ secrets.EXPO_PUBLIC_DEFAULT_MAP_CENTER_LATITUDE }}
          EXPO_PUBLIC_DEFAULT_MAP_CENTER_LONGITUDE: ${{ secrets.EXPO_PUBLIC_DEFAULT_MAP_CENTER_LONGITUDE }}
          EXPO_PUBLIC_DEFAULT_MAP_RADIUS_MILES: ${{ secrets.EXPO_PUBLIC_DEFAULT_MAP_RADIUS_MILES }}
          EXPO_PUBLIC_OSM_OVERPASS_API_URL: ${{ secrets.EXPO_PUBLIC_OSM_OVERPASS_API_URL }}
          EXPO_PUBLIC_OSM_OVERPASS_API_URL_TWO: ${{ secrets.EXPO_PUBLIC_OSM_OVERPASS_API_URL_TWO }}
          EXPO_PUBLIC_OSM_OVERPASS_API_URL_THREE: ${{ secrets.EXPO_PUBLIC_OSM_OVERPASS_API_URL_THREE }}
          EXPO_PUBLIC_STRAVA_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_STRAVA_API_BASE_URL }}
          EXPO_PUBLIC_STRAVA_AUTHORIZE_URL: ${{ secrets.EXPO_PUBLIC_STRAVA_AUTHORIZE_URL }}
          EXPO_PUBLIC_STRAVA_AUTHORIZE_TOKEN_URL: ${{ secrets.EXPO_PUBLIC_STRAVA_AUTHORIZE_TOKEN_URL }}
          EXPO_PUBLIC_STEP_DISTANCE_METERS: ${{ secrets.EXPO_PUBLIC_STEP_DISTANCE_METERS }}
          EXPO_PUBLIC_TOLERANCE_METERS: ${{ secrets.EXPO_PUBLIC_TOLERANCE_METERS }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_AZURE_OPENAI_ENDPOINT: ${{ secrets.EXPO_PUBLIC_AZURE_OPENAI_ENDPOINT }}
          EXPO_PUBLIC_AZURE_OPENAI_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_OPENAI_KEY }}
          EXPO_PUBLIC_AZURE_OPENAI_DEPLOYMENT: ${{ secrets.EXPO_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
        run: |
          npm install
          npm run build --if-present
      
      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp client/package*.json deploy/ 2>/dev/null || true
          cp client/server.js deploy/ 2>/dev/null || true
          cp -r client/dist deploy/ 2>/dev/null || true
          cd deploy
          npm install --production
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C97DD4F20229442CA12F3A3E0FCF16EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FFF8A517DC1F4ADABE0475557A612C3C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_91ADFF63651E4593BFF667D7E9DAEB9C }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'streetsweeper'
          slot-name: 'Production'
          package: .
          